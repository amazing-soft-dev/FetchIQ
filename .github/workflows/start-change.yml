name: Start change

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Branch prefix
        required: true
        type: choice
        default: feat
        options:
          - feat
          - fix
          - docs
          - ci
          - build
      summary:
        description: Issue title, slugified into the branch name
        required: true
        type: string
      details:
        description: Optional issue body
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create issue and branch
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.prefix }}
          SUMMARY: ${{ inputs.summary }}
          DETAILS: ${{ inputs.details }}
        run: |
          set -eu

          case "$PREFIX" in
            feat|fix|docs|ci|build) ;;
            *)
              echo "Prefix must be feat, fix, docs, ci, or build."
              exit 1
              ;;
          esac

          slug="$(printf '%s' "$SUMMARY" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-' | sed -E 's/-+/-/g; s/^-+//; s/-+$//')"
          slug="${slug:0:50}"
          slug="$(printf '%s' "$slug" | sed -E 's/-+$//')"
          if [ -z "$slug" ]; then
            echo "Summary does not produce a branch slug."
            exit 1
          fi

          branch="${PREFIX}/${slug}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Remote branch ${branch} already exists."
            exit 1
          fi

          body_file="$(mktemp)"
          printf 'Branch: `%s`\n' "$branch" > "$body_file"
          if [ -n "$DETAILS" ]; then
            printf '\n%s\n' "$DETAILS" >> "$body_file"
          fi

          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$SUMMARY" --body-file "$body_file")"
          echo "Created ${issue_url}"

          git fetch origin dev
          git push origin "origin/dev:refs/heads/${branch}"

          comment_file="$(mktemp)"
          printf 'git fetch origin && git checkout %s\n' "$branch" > "$comment_file"
          gh issue comment "$issue_url" --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"
