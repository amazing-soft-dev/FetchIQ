name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    # Pinned: MongoDB 8.0+ crashes on Linux kernels 6.19 and newer (tcmalloc rseq,
    # https://jira.mongodb.org/browse/SERVER-125742), and both ubuntu-latest and
    # ubuntu-24.04 now ship such kernels. ubuntu-22.04 runs kernel 6.8. Move back to
    # ubuntu-latest once a MongoDB 8 release with the fix is published.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python }}-pip-

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Pytest
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
        env:
          DATABASE_NAME: fetchiq_test
          MONGODB_URI: mongodb://localhost:27017

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-py${{ matrix.python }}
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.12"

      - name: Generate API types from the backend
        if: steps.detect.outputs.exists == 'true'
        run: |
          python -m pip install --quiet -r backend/requirements.txt
          python backend/scripts/openapi.py
          cd frontend && npm run types

      - name: API types are current
        if: steps.detect.outputs.exists == 'true'
        run: |
          if ! git diff --exit-code -- frontend/lib/api-types.ts; then
            echo "::error::frontend/lib/api-types.ts is out of date. Run: python backend/scripts/openapi.py && (cd frontend && npm run types)"
            exit 1
          fi

      - name: Typecheck
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm test

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
