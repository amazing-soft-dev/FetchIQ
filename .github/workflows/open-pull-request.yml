name: Open pull request

on:
  push:
    branches:
      - dev
      - feat/**
      - fix/**
      - docs/**
      - ci/**
      - build/**
  workflow_dispatch:
    inputs:
      branch:
        description: Existing branch to open into dev
        required: true
        type: string

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            head="${{ inputs.branch }}"
            base="dev"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            head="dev"
            base="main"
          else
            head="${{ github.ref_name }}"
            base="dev"
          fi

          case "$head" in
            feat/*|fix/*|docs/*|ci/*|build/*|dev) ;;
            *) echo "Branch $head is not eligible."; exit 0 ;;
          esac

          git fetch origin "$base" "$head"
          if [ "$base" = "main" ] && [ "$(git rev-list --count "origin/main..origin/dev")" = "0" ]; then
            echo "dev has nothing new for main."
            exit 0
          fi
          case "$head" in
            feat/*|fix/*|docs/*|ci/*|build/*)
              if [ "$(git rev-list --count "origin/dev..origin/$head")" = "0" ]; then
                echo "$head has no commits ahead of dev."
                exit 0
              fi
              ;;
          esac

          existing="$(gh pr list --repo "$repo" --base "$base" --head "$owner:$head" --state open --json number --jq length)"
          if [ "$existing" != "0" ]; then
            echo "Pull request already open."
            exit 0
          fi

          title="$(git log -1 --format=%s "origin/$head")"
          closes="$(git log "origin/$base..origin/$head" --format=%B | grep -E '^(Closes|Fixes|Resolves) #[0-9]+$' || true)"
          body="Opened automatically from \`$head\`."
          if [ -n "$closes" ]; then
            body="$body

            $closes"
          fi
          if ! created="$(gh pr create --repo "$repo" --base "$base" --head "$head" --title "$title" --body "$body" 2>&1)"; then
            case "$created" in
              *"already exists"*) echo "$created"; exit 0 ;;
            esac
            echo "$created" >&2
            exit 1
          fi
          echo "$created"
