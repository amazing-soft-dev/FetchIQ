name: Open pull request

on:
  push:
    branches:
      - dev
      - feat/**
      - fix/**
      - docs/**
      - ci/**
      - build/**
  workflow_dispatch:
    inputs:
      branch:
        description: Existing branch to open into dev
        required: true
        type: string

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            head="${{ inputs.branch }}"
            base="dev"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            head="dev"
            base="main"
          else
            head="${{ github.ref_name }}"
            base="dev"
          fi

          case "$head" in
            feat/*|fix/*|docs/*|ci/*|build/*|dev) ;;
            *) echo "Branch $head is not eligible."; exit 0 ;;
          esac

          git fetch origin "$base" "$head"
          if [ "$base" = "main" ] && [ "$(git rev-list --count "origin/main..origin/dev")" = "0" ]; then
            echo "dev has nothing new for main."
            exit 0
          fi
          case "$head" in
            feat/*|fix/*|docs/*|ci/*|build/*)
              if [ "$(git rev-list --count "origin/dev..origin/$head")" = "0" ]; then
                echo "$head has no commits ahead of dev."
                exit 0
              fi
              ;;
          esac

          issue_numbers() {
            tr -d '\r' \
              | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
              | grep -oE '[0-9]+$' || true
          }

          range="origin/$base..origin/$head"
          numbers="$(git log "$range" --format=%B | issue_numbers)"
          if [ "$base" = "main" ]; then
            merged="$(git log "$range" --format=%s | grep -oE '(Merge pull request #|\(#)[0-9]+' | grep -oE '[0-9]+$' || true)"
            for pr in $merged; do
              pr_body="$(gh pr view "$pr" --repo "$repo" --json body --jq '.body // ""' | issue_numbers)"
              pr_linked="$(gh pr view "$pr" --repo "$repo" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')"
              numbers="$numbers"$'\n'"$pr_body"$'\n'"$pr_linked"
            done
          fi

          body="Opened automatically from \`$head\`."
          for number in $(echo "$numbers" | grep -E '^[0-9]+$' | sort -nu || true); do
            body="$body"$'\n'"Closes #$number"
          done

          existing="$(gh pr list --repo "$repo" --base "$base" --head "$owner:$head" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            if [ "$base" = "main" ]; then
              gh pr edit "$existing" --repo "$repo" --body "$body"
              echo "Updated pull request #$existing."
            else
              echo "Pull request already open."
            fi
            exit 0
          fi

          title="$(git log -1 --format=%s "origin/$head")"
          if ! created="$(gh pr create --repo "$repo" --base "$base" --head "$head" --title "$title" --body "$body" 2>&1)"; then
            case "$created" in
              *"already exists"*) echo "$created"; exit 0 ;;
            esac
            echo "$created" >&2
            exit 1
          fi
          echo "$created"
